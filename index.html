<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <section class="products">
      <article class="card">
        <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence EDP" class="mobile-img">
        <img src="images/image-product-desktop.jpg" alt="Gabrielle Essence EDP" class="desktop-img">
        <div class="card-description">
          <div class="product-type">
            Perfume
          </div>
          <div class="product-name">
            <strong>Gabrielle Essence Eau De Parfum</strong>
          </div>
          <p class="product-caption">
              A floral, solar and voluptuous interpretation composed by Olivier Polge, 
              Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="price">
            <strong class="promo-price">$149.99</strong>
            <span class="rrp">$169.99</span>
          </div>
          <button class="add-cart">
            <img src="images/icon-cart.svg" alt="shopping cart">
            <div>Add to Cart</div>
          </button>
        </div>
      </article>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
